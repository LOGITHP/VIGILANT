services:
  db:
    image: postgres:16-alpine
    container_name: vigilant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vigilant_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vigilant_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vigilant-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilant_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/vigilant_db
      JWT_SECRET: vigilant_super_secure_jwt_secret_change_in_production_key_2026
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      INITIAL_ADMIN_EMAIL: cctv@gmail.com
      INITIAL_ADMIN_PASSWORD: 123456789
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173", "http://localhost:3000", "*"]'
    ports:
      - "8000:8000"
    networks:
      - vigilant-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vigilant_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    networks:
      - vigilant-net

volumes:
  postgres_data:
    name: vigilant_postgres_data

networks:
  vigilant-net:
    driver: bridge
